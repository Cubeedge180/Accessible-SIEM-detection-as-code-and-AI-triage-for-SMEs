[project]
name = "accessible-siem"
version = "0.0.1"
description = "Lightweight SIEM for SMEs: Sigma detection-as-code and local LLM triage"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
